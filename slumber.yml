profiles:
    development:
        data:
            todo_host: http://localhost:8080

requests:
    list:
        method: GET
        url: "{{todo_host}}/api/todos"

    todo:
        method: POST
        url: "{{todo_host}}/api/todos"
        body:
          type: json
          data:
            description: string
            done: true
            title: string

