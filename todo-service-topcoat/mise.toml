[tasks.test]
run = "cargo test -- --test-threads 1 --nocapture"

[tasks.cap]
run = "cargo test"

[tasks.trace]
env.RUST_BACKTRACE = 1
run = "cargo test"

[tasks.build]
raw_args = true
run = "cargo build"

[tasks.clean]
run = "cargo clean"

[tasks.crun]
run = "cargo run"

[tasks.cuc]
usage = '''
flag "-d --dry-run" {
    help "Enable dry-running"
}
'''
run = '''
DRY_RUN=-u

if [ ${usage_dry_run} ] ; then
    DRY_RUN=
fi

cargo update-check $DRY_RUN
'''

[tasks.clippy]
run = "bacon clippy"

[tasks.topcoat]
run = "PORT=8080 topcoat dev"

[tasks.hurl]
run = "hurl ../*.hurl"
